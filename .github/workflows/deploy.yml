name: Deploy to Cloudflare Pages
# Deploys site/ to the stella-maris Cloudflare Pages project on every push
# to main. The project lives on the mediatrixdev@proton.me Cloudflare
# account (id 95d30883324e9658fb8239a2f84c24e6) — NOT the legacy
# aicoding47@gmail.com account (ee05ecc6...). API tokens and account IDs
# must be issued from the mediatrixdev account.
#
# Requires two repository secrets at
# https://github.com/MediatrixLibre/Mediatrix/settings/secrets/actions:
#
#   - CLOUDFLARE_API_TOKEN: issued from the mediatrixdev@proton.me CF
#     account at https://dash.cloudflare.com/profile/api-tokens
#     -> "Create Token" -> "Custom token" with: "Cloudflare Pages: Edit",
#     "Account: Read", "User Details: Read".
#
#   - CLOUDFLARE_ACCOUNT_ID: 95d30883324e9658fb8239a2f84c24e6
#
# Once those are set, every push to main auto-deploys. Local `wrangler
# pages deploy` also works for hot-fixing — see DEPLOY.md §4.0 for the
# env-var pattern that bypasses the local OAuth session (which is still
# bound to aicoding47@gmail.com).

on:
  push:
    branches: [main]
    paths-ignore:
      - "DEPLOY.md"
      - "**.md"
      - ".github/**"
      - "reviews/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: wrangler pages deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Corpus-independent publish gates (proper exit codes). The
      # corpus-dependent gates (verify-data-sync, validate-refs — the
      # latter scans corpus markdown and is vacuously green without it)
      # run in the local pre-push hook instead, since the corpus lives
      # outside the repo. A drifted derived page or a broken quote
      # record refuses the deploy.
      - name: Publish gates (quote integrity, derived-page sync)
        run: |
          make validate-quotes
          make verify-apparatus-sync

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=stella-maris --branch=main --commit-dirty=true

      - name: Ping IndexNow
        run: python3 tools/indexnow-ping.py
        continue-on-error: true

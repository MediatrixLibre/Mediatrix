<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="100%" stop-color="#0C2340"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#C99700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C99700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Marian blue background -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Subtle gold halo behind the star -->
  <circle cx="90" cy="90" r="72" fill="url(#glow)"/>

  <!-- Outer ring: 12 stars of Rev 12:1, rendered as tiny gold dots -->
  <g fill="#C99700" opacity="0.35">
    <circle cx="90" cy="24" r="2.2"/>
    <circle cx="123" cy="33" r="2.2"/>
    <circle cx="147" cy="57" r="2.2"/>
    <circle cx="156" cy="90" r="2.2"/>
    <circle cx="147" cy="123" r="2.2"/>
    <circle cx="123" cy="147" r="2.2"/>
    <circle cx="90" cy="156" r="2.2"/>
    <circle cx="57" cy="147" r="2.2"/>
    <circle cx="33" cy="123" r="2.2"/>
    <circle cx="24" cy="90" r="2.2"/>
    <circle cx="33" cy="57" r="2.2"/>
    <circle cx="57" cy="33" r="2.2"/>
  </g>

  <!-- Stella Maris: 8-pointed star, gold on deep navy -->
  <g fill="#C99700" transform="translate(90,90)">
    <!-- Cardinal long points (N/S/E/W) -->
    <polygon points="0,-58 8,0 0,58 -8,0"/>
    <polygon points="-58,0 0,-8 58,0 0,8"/>
    <!-- Diagonal short points (NE/SE/SW/NW) -->
    <polygon points="-38,-38 -6,0 38,-38 0,-6" opacity="0.82"/>
    <polygon points="38,38 0,-6 38,-38 6,0" opacity="0.82"/>
    <polygon points="-38,38 6,0 -38,-38 0,6" opacity="0.82"/>
    <polygon points="38,38 0,6 -38,38 -6,0" opacity="0.82"/>
    <!-- Center jewel -->
    <circle cx="0" cy="0" r="5.5" fill="#C99700"/>
    <circle cx="0" cy="0" r="3" fill="#1E3A6E" opacity="0.4"/>
  </g>
</svg>
